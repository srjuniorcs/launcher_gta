plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.gtasgntrj.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.gtasgntrj.launcher'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
